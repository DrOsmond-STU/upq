<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Alat — Sistem Manajemen Data UPQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/css/tailwind.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="page-template">
  <div class="grid sm:grid-cols-4 gap-5 mb-6">
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Total Alat Terdaftar</div><div class="stat-num !text-2xl text-[var(--ink-900)]">18</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Terjadwal Bulan Ini</div><div class="stat-num !text-2xl text-[var(--info-text)]">1</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Selesai Bulan Ini</div><div class="stat-num !text-2xl text-[var(--ok-text)]">3</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Menunggu Suku Cadang</div><div class="stat-num !text-2xl text-[var(--warn-text)]">1</div></div>
  </div>

  <div class="card p-5 md:p-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
      <h3 class="font-bold text-[15px] text-[var(--ink-900)]">Jadwal &amp; Riwayat Maintenance</h3>
      <div class="flex gap-3">
        <div class="input-icon-wrap w-56"><i class="fa-solid fa-magnifying-glass text-sm"></i><input id="search-mt" class="input !py-2 text-sm" placeholder="Cari alat / teknisi..."></div>
        <button onclick="openModal('modal-mt')" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i>Jadwalkan Maintenance</button>
      </div>
    </div>
    <div class="table-wrap !border-none">
      <table class="data-table">
        <thead><tr><th>No. Maintenance</th><th>Nama Alat</th><th>Jenis</th><th>Tanggal</th><th>Teknisi</th><th>Durasi</th><th>Status</th></tr></thead>
        <tbody id="tbl-mt"></tbody>
      </table>
    </div>
  </div>
</template>

<div id="modal-mt" class="modal-backdrop hidden">
  <div class="modal-box">
    <div class="flex items-center justify-between px-6 py-5 border-b border-[var(--line)]">
      <h3 class="font-display font-bold text-lg text-[var(--ink-900)]">Jadwalkan Maintenance Alat</h3>
      <button onclick="closeModal('modal-mt')" class="text-[var(--ink-300)] hover:text-[var(--ink-900)]"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <form class="p-6 space-y-4" onsubmit="event.preventDefault(); closeModal('modal-mt');">
      <div><label class="field-label">Nama Alat / Mesin</label><select class="input"><option>Mesin Cetak Offset Heidelberg SM-102</option><option>Mesin Jilid Perfect Binding Muller Martini</option><option>Mesin Potong Kertas Polar 115</option><option>Mesin Cetak Digital Konica Minolta AccurioPress</option><option>Mesin Laminating Cover</option></select></div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="field-label">Jenis Maintenance</label><select class="input"><option>Preventive</option><option>Corrective</option></select></div>
        <div><label class="field-label">Tanggal Pelaksanaan</label><input type="date" class="input"></div>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="field-label">Teknisi Penanggung Jawab</label><input class="input" placeholder="Nama teknisi"></div>
        <div><label class="field-label">Estimasi Durasi</label><input class="input" placeholder="Contoh: 3 jam"></div>
      </div>
      <div><label class="field-label">Catatan Kerusakan / Kebutuhan</label><textarea class="input" rows="2" placeholder="Deskripsi kondisi alat"></textarea></div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="closeModal('modal-mt')" class="btn btn-line">Batal</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i>Simpan Jadwal</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/layout.js"></script>
<script src="assets/js/data.js"></script>
<script>
  renderInternalShell({ active: "maintenance", title: "Maintenance Alat", breadcrumb: ["Internal","Proses Produksi","Maintenance Alat"] });
  document.getElementById("page-content").innerHTML = document.getElementById("page-template").innerHTML;

  const rowTpl = r => `
    <tr>
      <td class="font-bold text-[var(--ink-900)]">${r.id}</td>
      <td>${r.alat}</td>
      <td><span class="badge ${r.jenis==='Preventive' ? 'badge-info' : 'badge-warn'}">${r.jenis}</span></td>
      <td>${r.tgl}</td>
      <td>${r.teknisi}</td>
      <td>${r.durasi}</td>
      <td>${badge(r.status)}</td>
    </tr>`;
  renderRows("tbl-mt", DATA_MAINTENANCE, rowTpl);
  attachSearchFilter("search-mt", () => DATA_MAINTENANCE, "tbl-mt", rowTpl, ["id","alat","teknisi"]);
</script>
</body>
</html>
