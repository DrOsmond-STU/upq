<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking Pengiriman Mushaf — Sistem Manajemen Data UPQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css?v=4">
<link rel="stylesheet" href="assets/css/tailwind.min.css?v=4">
<link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="page-template">
  <div class="grid sm:grid-cols-4 gap-5 mb-6">
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Total Pengiriman</div><div class="stat-num !text-2xl text-[var(--ink-900)]">4</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Dalam Pengiriman</div><div class="stat-num !text-2xl text-[var(--info-text)]">1</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Diterima Sesuai</div><div class="stat-num !text-2xl text-[var(--ok-text)]">1</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Bermasalah</div><div class="stat-num !text-2xl text-[var(--danger-text)]">1</div></div>
  </div>

  <div class="card p-5 md:p-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
      <div class="flex flex-wrap gap-2" id="status-filter">
        <button data-status="Semua" class="btn btn-sm btn-primary sf-btn">Semua</button>
        <button data-status="Diproses" class="btn btn-sm btn-line sf-btn">Diproses</button>
        <button data-status="Dalam Pengiriman" class="btn btn-sm btn-line sf-btn">Dalam Pengiriman</button>
        <button data-status="Diterima" class="btn btn-sm btn-line sf-btn">Diterima</button>
        <button data-status="Bermasalah" class="btn btn-sm btn-line sf-btn">Bermasalah</button>
      </div>
      <div class="input-icon-wrap w-64"><i class="fa-solid fa-magnifying-glass text-sm"></i><input id="search-spk" class="input !py-2 text-sm" placeholder="Cari no. pengiriman / instansi..."></div>
    </div>
    <div class="table-wrap !border-none">
      <table class="data-table">
        <thead><tr><th>No. Pengiriman</th><th>Produk</th><th>Qty Kirim</th><th>Tujuan</th><th>Tgl Kirim</th><th>Estimasi Tiba</th><th>Status</th><th>Verifikasi</th><th></th></tr></thead>
        <tbody id="tbl-spk"></tbody>
      </table>
    </div>
  </div>
</template>

<!-- DETAIL MODAL -->
<div id="modal-detail" class="modal-backdrop hidden">
  <div class="modal-box !max-w-3xl" id="detail-content"></div>
</div>

<script src="assets/js/layout.js?v=4"></script>
<script src="assets/js/data.js?v=4"></script>
<script>
  renderInternalShell({ active: "tracking-pengiriman", title: "Tracking Pengiriman Mushaf", breadcrumb: ["Internal","Tracking Pengiriman"] });
  document.getElementById("page-content").innerHTML = document.getElementById("page-template").innerHTML;

  const rowTpl = s => `
    <tr class="cursor-pointer" onclick="showDetail('${s.id}')">
      <td class="font-bold text-[var(--brand-600)]">${s.id}</td>
      <td>${s.produk}</td>
      <td>${s.qty}</td>
      <td>${s.tujuan}</td>
      <td>${s.tglKirim}</td>
      <td>${s.estimasi}</td>
      <td>${badge(s.status)}</td>
      <td>${badge(s.verifikasi)}</td>
      <td><button class="text-[var(--brand-600)] font-bold text-xs">Detail <i class="fa-solid fa-chevron-right text-[10px]"></i></button></td>
    </tr>`;

  let activeStatus = "Semua";
  function applyFilter(){
    const q = document.getElementById("search-spk").value.trim().toLowerCase();
    const rows = DATA_SHIPMENTS.filter(s =>
      (activeStatus === "Semua" || s.status === activeStatus) &&
      (!q || s.id.toLowerCase().includes(q) || s.tujuan.toLowerCase().includes(q))
    );
    renderRows("tbl-spk", rows, rowTpl);
  }
  document.querySelectorAll(".sf-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".sf-btn").forEach(b => b.classList.replace("btn-primary","btn-line"));
      btn.classList.replace("btn-line","btn-primary");
      activeStatus = btn.dataset.status;
      applyFilter();
    });
  });
  document.getElementById("search-spk").addEventListener("input", applyFilter);
  applyFilter();

  function showDetail(id){
    const s = DATA_SHIPMENTS.find(x => x.id === id);
    if (!s) return;
    document.getElementById("detail-content").innerHTML = `
      <div class="flex items-center justify-between px-6 py-5 border-b border-[var(--line)]">
        <div>
          <div class="text-xs text-[var(--ink-500)] font-semibold">${s.id}</div>
          <h3 class="font-display font-bold text-lg text-[var(--ink-900)]">${s.produk}</h3>
        </div>
        <button onclick="closeModal('modal-detail')" class="text-[var(--ink-300)] hover:text-[var(--ink-900)]"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-6 grid md:grid-cols-5 gap-8">
        <div class="md:col-span-2 space-y-5">
          <div>
            <div class="text-xs font-bold text-[var(--ink-500)] uppercase mb-2">Ringkasan</div>
            <div class="text-sm space-y-2 text-[var(--ink-700)]">
              <div class="flex justify-between"><span class="text-[var(--ink-500)]">Jumlah Dikirim</span><span class="font-semibold">${s.qty}</span></div>
              <div class="flex justify-between"><span class="text-[var(--ink-500)]">Tujuan</span><span class="font-semibold text-right">${s.tujuan}</span></div>
              <div class="flex justify-between"><span class="text-[var(--ink-500)]">Penerima</span><span class="font-semibold text-right">${s.penerima}</span></div>
              <div class="flex justify-between"><span class="text-[var(--ink-500)]">Ekspedisi</span><span class="font-semibold text-right">${s.ekspedisi}</span></div>
              <div class="flex justify-between"><span class="text-[var(--ink-500)]">Estimasi Tiba</span><span class="font-semibold">${s.estimasi}</span></div>
            </div>
          </div>
          <div class="rounded-xl p-4 ${s.verifikasi === 'Sesuai' ? 'bg-[var(--ok-bg)]' : s.verifikasi === 'Tidak Sesuai' ? 'bg-[var(--danger-bg)]' : 'bg-[var(--neutral-bg)]'}">
            <div class="text-xs font-bold uppercase mb-2 ${s.verifikasi === 'Sesuai' ? 'text-[var(--ok-text)]' : s.verifikasi === 'Tidak Sesuai' ? 'text-[var(--danger-text)]' : 'text-[var(--neutral-text)]'}">Verifikasi Kesesuaian Penerima</div>
            <div class="text-sm space-y-1.5">
              <div class="flex justify-between"><span>Status</span>${badge(s.verifikasi)}</div>
              <div class="flex justify-between"><span>Qty Diterima</span><strong>${s.qtyDiterima}</strong></div>
            </div>
            ${s.catatan ? `<p class="text-xs mt-3 leading-relaxed">${s.catatan}</p>` : `<p class="text-xs mt-3 text-[var(--ink-500)]">Belum ada catatan verifikasi.</p>`}
          </div>
        </div>
        <div class="md:col-span-3">
          <div class="text-xs font-bold text-[var(--ink-500)] uppercase mb-4">Riwayat Perjalanan Pengiriman</div>
          <div class="timeline">
            ${s.timeline.map(t => `
              <div class="timeline-item ${t.done ? 'done' : ''} ${t.current ? 'current' : ''}">
                <div class="timeline-dot"><i class="fa-solid ${t.problem ? 'fa-triangle-exclamation' : (t.done ? 'fa-check' : 'fa-circle')} ${t.done ? '' : 'text-[8px]'}"></i></div>
                <div class="font-bold text-sm ${t.done ? 'text-[var(--ink-900)]' : 'text-[var(--ink-300)]'}">${t.label}</div>
                <div class="text-xs text-[var(--ink-500)] mt-0.5">${t.tgl}</div>
              </div>`).join("")}
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-[var(--line)] flex justify-end gap-3">
        <button class="btn btn-line btn-sm"><i class="fa-solid fa-print"></i>Cetak Surat Jalan</button>
        <button class="btn btn-primary btn-sm"><i class="fa-solid fa-pen"></i>Update Status</button>
      </div>
    `;
    openModal("modal-detail");
  }
</script>
</body>
</html>
