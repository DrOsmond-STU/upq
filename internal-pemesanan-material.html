<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pemesanan Raw Material &amp; Sparepart — Sistem Manajemen Data UPQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css?v=4">
<link rel="stylesheet" href="assets/css/tailwind.min.css?v=4">
<link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="page-template">
  <div class="grid sm:grid-cols-3 gap-5 mb-6">
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Total Pemesanan Bulan Ini</div><div class="stat-num !text-2xl text-[var(--ink-900)]">7</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Menunggu Kedatangan</div><div class="stat-num !text-2xl text-[var(--warn-text)]">2</div></div>
    <div class="kpi-card"><div class="text-xs text-[var(--ink-500)] mb-1">Diterima Bulan Ini</div><div class="stat-num !text-2xl text-[var(--ok-text)]">4</div></div>
  </div>

  <div class="card p-5 md:p-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
      <div class="flex gap-6 border-b border-[var(--line)] md:border-0" data-tab-group="pesan">
        <button class="tab-btn active" data-tab-btn="semua">Semua</button>
        <button class="tab-btn" data-tab-btn="Raw Material">Raw Material</button>
        <button class="tab-btn" data-tab-btn="Sparepart">Sparepart</button>
      </div>
      <div class="flex gap-3">
        <div class="input-icon-wrap w-56"><i class="fa-solid fa-magnifying-glass text-sm"></i><input id="search-pesan" class="input !py-2 text-sm" placeholder="Cari no. PO / item..."></div>
        <button onclick="openModal('modal-tambah')" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i>Tambah Pemesanan</button>
      </div>
    </div>

    <div class="table-wrap !border-none">
      <table class="data-table">
        <thead><tr><th>No. PO</th><th>Jenis</th><th>Nama Item</th><th>Jumlah</th><th>Pemasok</th><th>Tgl. Pesan</th><th>Estimasi Tiba</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbl-pesan"></tbody>
      </table>
    </div>
  </div>
</template>

<!-- MODAL TAMBAH -->
<div id="modal-tambah" class="modal-backdrop hidden">
  <div class="modal-box">
    <div class="flex items-center justify-between px-6 py-5 border-b border-[var(--line)]">
      <h3 class="font-display font-bold text-lg text-[var(--ink-900)]">Tambah Pemesanan Material</h3>
      <button onclick="closeModal('modal-tambah')" class="text-[var(--ink-300)] hover:text-[var(--ink-900)]"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <form class="p-6 space-y-4" onsubmit="event.preventDefault(); closeModal('modal-tambah');">
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="field-label">Jenis Pemesanan</label><select class="input"><option>Raw Material</option><option>Sparepart</option></select></div>
        <div><label class="field-label">No. PO (Otomatis)</label><input class="input" value="PO-2026-0092" disabled></div>
      </div>
      <div><label class="field-label">Nama Item</label><input class="input" placeholder="Contoh: Kertas HVS 60gr"></div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="field-label">Jumlah</label><input class="input" placeholder="Contoh: 5.000 rim"></div>
        <div><label class="field-label">Pemasok</label><input class="input" placeholder="Nama pemasok/vendor"></div>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="field-label">Tanggal Pemesanan</label><input type="date" class="input"></div>
        <div><label class="field-label">Estimasi Tiba</label><input type="date" class="input"></div>
      </div>
      <div><label class="field-label">Catatan</label><textarea class="input" rows="2" placeholder="Catatan tambahan (opsional)"></textarea></div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="closeModal('modal-tambah')" class="btn btn-line">Batal</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i>Simpan Pemesanan</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/layout.js?v=4"></script>
<script src="assets/js/data.js?v=4"></script>
<script>
  renderInternalShell({ active: "pemesanan-material", title: "Pemesanan Raw Material & Sparepart", breadcrumb: ["Internal","Proses Produksi","Pemesanan Material"] });
  document.getElementById("page-content").innerHTML = document.getElementById("page-template").innerHTML;
  initTabs();

  const rowTpl = r => `
    <tr>
      <td class="font-bold text-[var(--ink-900)]">${r.id}</td>
      <td><span class="badge badge-neutral">${r.jenis}</span></td>
      <td>${r.item}</td>
      <td>${r.qty}</td>
      <td>${r.pemasok}</td>
      <td>${r.tgl}</td>
      <td>${r.eta}</td>
      <td>${badge(r.status)}</td>
      <td><button class="text-[var(--ink-300)] hover:text-[var(--brand-600)]"><i class="fa-solid fa-ellipsis-vertical"></i></button></td>
    </tr>`;

  let activeTab = "semua";
  function applyPesanFilter(){
    const q = document.getElementById("search-pesan").value.trim().toLowerCase();
    const rows = DATA_PEMESANAN.filter(r =>
      (activeTab === "semua" || r.jenis === activeTab) &&
      (!q || r.id.toLowerCase().includes(q) || r.item.toLowerCase().includes(q))
    );
    renderRows("tbl-pesan", rows, rowTpl);
  }
  document.querySelectorAll('[data-tab-group="pesan"] [data-tab-btn]').forEach(btn => {
    btn.addEventListener("click", () => { activeTab = btn.dataset.tabBtn; applyPesanFilter(); });
  });
  document.getElementById("search-pesan").addEventListener("input", applyPesanFilter);
  applyPesanFilter();
</script>
</body>
</html>
